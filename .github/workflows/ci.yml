name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Set a git identity so the suite's fixtures can always commit
        run: |
          git config --global user.name "tumwater ci"
          git config --global user.email "ci@tumwater.local"
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
