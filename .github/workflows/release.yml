name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # lts/* — the same Node the CI gate runs the suite on, so the tag re-runs the
          # gate's exact environment instead of a version the gate never exercises.
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Set a git identity so the suite's fixtures can always commit
        run: |
          git config --global user.name "tumwater release"
          git config --global user.email "release@tumwater.local"
      - run: npm ci
      # setup-node writes `always-auth=false` into its temp .npmrc (its input default);
      # npm 11 warns "Unknown user config" on every invocation and the warning leaks into
      # captured build output, failing review-precheck's exact-match assertions — an
      # environment difference the CI gate never sees (it passes no registry-url, so no
      # line is written). Drop the line; the registry + authToken lines stay.
      - name: Drop setup-node's unknown always-auth line from the runner npmrc
        run: sed -i '/^always-auth=/d' "${NPM_CONFIG_USERCONFIG:-${RUNNER_TEMP:-/tmp}/.npmrc}"
      - run: npm test
      # `npm stage publish` needs npm >= 11.5.1; Node 22 on the runner ships npm 10.
      - run: npm install -g npm@11
      - name: Refuse a tag whose name disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi
      # Publishes via OIDC trusted publishing (configured once with `npm trust github`): no
      # token involved, and npm generates the provenance attestation automatically. The
      # stage-only NPM_TOKEN path was the one-time bootstrap for 0.1.0 and is retired.
      - run: npm publish --access public --provenance
      - name: Attach the packed tarball to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes tumwater-*.tgz
