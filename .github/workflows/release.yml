name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # lts/* — the same Node the CI gate runs the suite on, so the tag re-runs the
          # gate's exact environment instead of a version the gate never exercises.
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Set a git identity so the suite's fixtures can always commit
        run: |
          git config --global user.name "tumwater release"
          git config --global user.email "release@tumwater.local"
      - run: npm ci
      - run: npm test
      # `npm stage publish` needs npm >= 11.5.1; Node 22 on the runner ships npm 10.
      - run: npm install -g npm@11
      - name: Refuse a tag whose name disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi
      # NPM_TOKEN is a Read-and-write (stage-only) granular token: it cannot publish
      # directly (npm deprecates direct-publish bypass-2FA tokens, removal January 2027).
      # This stages the version; a maintainer approves it with 2FA (npm stage approve).
      - run: npm stage publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach the packed tarball to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes tumwater-*.tgz
