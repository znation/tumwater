name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Set a git identity so the suite's fixtures can always commit
        run: |
          git config --global user.name "tumwater release"
          git config --global user.email "release@tumwater.local"
      - run: npm ci
      - run: npm test
      - name: Refuse a tag whose name disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi
      - run: npm publish --access public
        # add --provenance once the repo is public (it needs a public GitHub repo
        # whose `repository` field matches, and this repo has no remote yet)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach the packed tarball to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes tumwater-*.tgz
